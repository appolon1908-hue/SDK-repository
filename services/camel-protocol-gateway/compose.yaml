services:
  camel-protocol-gateway:
    profiles: ["optional-camel"]
    image: ${CODESTRA_CAMEL_GATEWAY_IMAGE:?Set an immutable image reference with an sha256 digest}
    restart: "no"
    environment:
      CODESTRA_CAMEL_ENABLED: ${CODESTRA_CAMEL_ENABLED:-false}
      CODESTRA_ALLOWED_PROTOCOLS: ${CODESTRA_ALLOWED_PROTOCOLS:-}
      CODESTRA_ALLOWED_OPERATIONS: ${CODESTRA_ALLOWED_OPERATIONS:-}
    expose:
      - "8080"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "java", "-version"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - codestra-private

networks:
  codestra-private:
    external: true
    name: ${CODESTRA_PRIVATE_NETWORK:-codestra-private}
