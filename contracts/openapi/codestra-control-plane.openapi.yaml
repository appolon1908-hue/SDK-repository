openapi: 3.1.0
info:
  title: Codestra Middleware Control Plane API
  version: 0.1.0
  description: >
    Service-to-service control-plane contract mirroring the principal
    appolon1908-hue/Middleware- runtime. Clients call the governed Codestra
    API edge; Caddy and Kong remain the public security boundary and
    Middleware remains the cross-system write authority.
servers:
  - url: https://api.codestra.co
security:
  - serviceBearer: []
paths:
  /v1/commands:
    post:
      operationId: submitCommand
      summary: Submit one durable cross-system command
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommandEnvelope'
      responses:
        '200':
          description: Existing command replayed from the durable idempotency ledger
          headers:
            Location:
              schema: { type: string }
            X-Correlation-ID:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandOperation'
        '202':
          description: New command persisted and accepted for durable execution
          headers:
            Location:
              schema: { type: string }
            X-Correlation-ID:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandOperation'
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /v1/operations/{command_id}:
    get:
      operationId: getOperation
      summary: Read one tenant-scoped durable command operation
      parameters:
        - name: command_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/TenantId'
      responses:
        '200':
          description: Current durable command state
          headers:
            X-Correlation-ID:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandOperation'
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    serviceBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    TenantId:
      name: X-Tenant-ID
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 180
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 180
  responses:
    Error:
      description: Canonical Middleware error response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    CommandEnvelope:
      type: object
      additionalProperties: false
      required:
        - command_id
        - command_type
        - command_version
        - target
        - tenant_id
        - requested_by
        - correlation_id
        - idempotency_key
        - capability
        - payload
      properties:
        command_id:
          type: string
          format: uuid
        command_type:
          type: string
          pattern: '^[a-z0-9]+(?:[.-][a-z0-9]+)+$'
          maxLength: 180
        command_version:
          type: string
          const: '1.0'
        target:
          type: string
          pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
          maxLength: 100
        tenant_id:
          type: string
          minLength: 1
          maxLength: 128
        requested_by:
          type: string
          minLength: 1
          maxLength: 300
        correlation_id:
          type: string
          minLength: 1
          maxLength: 180
        idempotency_key:
          type: string
          minLength: 8
          maxLength: 180
        capability:
          type: string
          pattern: '^[A-Z][A-Z0-9_]{2,100}$'
        payload:
          type: object
          description: Provider/product payload. Middleware additionally enforces a 262144-byte canonical JSON limit.
    CommandOperation:
      type: object
      additionalProperties: false
      required:
        - command_id
        - tenant_id
        - command_type
        - command_version
        - target
        - requested_by
        - correlation_id
        - idempotency_key
        - capability
        - state
        - created_at
        - updated_at
        - duplicate
      properties:
        command_id: { type: string, format: uuid }
        tenant_id: { type: string }
        command_type: { type: string }
        command_version: { type: string }
        target: { type: string }
        requested_by: { type: string }
        correlation_id: { type: string }
        idempotency_key: { type: string }
        capability: { type: string }
        state:
          type: string
          enum:
            - RECEIVED
            - QUEUED
            - SUBMITTED
            - ACCEPTED
            - UNKNOWN
            - COMPLETED
            - FAILED
            - RECONCILIATION_REQUIRED
            - DEAD_LETTERED
            - CANCELLED
        provider_operation_id:
          type: [string, 'null']
        last_error:
          type: [string, 'null']
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        duplicate: { type: boolean, default: false }
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, correlation_id, retryable, details]
          properties:
            code: { type: string }
            message: { type: string }
            correlation_id: { type: string }
            retryable: { type: boolean }
            details: { type: object }
