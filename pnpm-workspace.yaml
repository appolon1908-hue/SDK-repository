packages:
  - packages/*
  - integrations/*
  - sdks/*
  - services/*
  - apps/*

autoInstallPeers: false

allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  isolated-vm: true
  msw: true
  prisma: true

onlyBuiltDependencies:
  - esbuild
  - isolated-vm
  - '@prisma/client'
  - '@prisma/engines'
  - prisma

overrides:
  '@jridgewell/sourcemap-codec': 1.5.5
  fastq: 1.20.1
