name: Contract validation

on:
  pull_request:
    paths:
      - 'contracts/**'
      - 'packages/contracts/**'
      - 'scripts/validate-contracts.mjs'
      - '.github/workflows/contracts.yml'
  push:
    branches:
      - 'feat/01-contracts'

permissions:
  contents: read

concurrency:
  group: contracts-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Validate canonical contracts
        run: pnpm contracts:validate
      - name: Type-check contract package
        run: pnpm --filter @codestra/contracts typecheck
      - name: Test contract package
        run: pnpm --filter @codestra/contracts test
