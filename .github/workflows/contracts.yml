name: Contract validation

on:
  pull_request:
    paths:
      - 'contracts/**'
      - 'packages/contracts/**'
      - 'scripts/validate-contracts.mjs'
      - 'scripts/validate-json-schemas.mjs'
      - 'scripts/test-contract-validator.mjs'
      - 'test/fixtures/contracts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/contracts.yml'
  push:
    branches:
      - 'feat/01-contracts'

permissions:
  contents: read

concurrency:
  group: contracts-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REDOCLY_TELEMETRY: off
  REDOCLY_SUPPRESS_UPDATE_NOTICE: "true"

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate canonical contracts semantically
        run: pnpm contracts:validate
      - name: Prove invalid contracts fail closed
        run: pnpm contracts:validate:negative
      - name: Type-check contract package
        run: pnpm --filter @codestra/contracts typecheck
      - name: Test contract package
        run: pnpm --filter @codestra/contracts test
