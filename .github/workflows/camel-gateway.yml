name: Camel protocol gateway

on:
  pull_request:
    paths:
      - "services/camel-protocol-gateway/**"
      - ".github/workflows/camel-gateway.yml"
  push:
    branches: ["optional/10-camel-protocol-gateway"]
    paths:
      - "services/camel-protocol-gateway/**"
      - ".github/workflows/camel-gateway.yml"

permissions:
  contents: read

concurrency:
  group: camel-gateway-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Configure Java 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verify gateway
        working-directory: services/camel-protocol-gateway
        run: mvn --batch-mode --no-transfer-progress verify
