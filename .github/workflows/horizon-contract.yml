name: Horizon contract

on:
  pull_request:
    paths:
      - ".github/actions/horizon-validate/**"
      - ".github/workflows/horizon-contract.yml"
      - "docs/HORIZON-**"
  push:
    branches:
      - main
      - feature/horizon-unified-experience-v1
    paths:
      - ".github/actions/horizon-validate/**"
      - ".github/workflows/horizon-contract.yml"
      - "docs/HORIZON-**"

permissions:
  contents: read

jobs:
  self-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Prove the validator fails closed
        run: node .github/actions/horizon-validate/validate.mjs --self-test
