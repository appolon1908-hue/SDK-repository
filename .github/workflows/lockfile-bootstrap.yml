name: Bootstrap deterministic lockfile

on:
  push:
    branches:
      - 'fix/12-slice-0-deterministic-contract-ci'

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate lockfile without running lifecycle scripts
        run: pnpm install --lockfile-only --no-frozen-lockfile --ignore-scripts
      - name: Upload lockfile
        uses: actions/upload-artifact@v4
        with:
          name: slice-0-pnpm-lock-${{ github.sha }}
          path: pnpm-lock.yaml
          if-no-files-found: error
          retention-days: 1
