name: Bootstrap deterministic lockfile

on:
  push:
    branches:
      - 'fix/12-slice-0-deterministic-contract-ci'

permissions:
  contents: write

jobs:
  generate-and-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout slice branch
        uses: actions/checkout@v4
        with:
          ref: fix/12-slice-0-deterministic-contract-ci
          fetch-depth: 0
          persist-credentials: true
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate lockfile without lifecycle scripts
        run: pnpm install --lockfile-only --no-frozen-lockfile --ignore-scripts
      - name: Prove the generated lockfile is frozen-installable
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Commit the lockfile and remove this bootstrap workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git rm .github/workflows/lockfile-bootstrap.yml
          git commit -m "build(slice-0): commit deterministic pnpm lockfile"
          git push origin HEAD:refs/heads/fix/12-slice-0-deterministic-contract-ci
