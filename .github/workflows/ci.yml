name: Workspace CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: workspace-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REDOCLY_TELEMETRY: off
  REDOCLY_SUPPRESS_UPDATE_NOTICE: "true"

jobs:
  secret-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact revision with history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Scan repository and history for secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ github.token }}

  moneybee-python-connectors:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: python/moneybee-connectors/pyproject.toml
      - name: Install connector and audit tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "python/moneybee-connectors[test]"
          python -m pip install pip-audit==2.10.1 cyclonedx-bom==7.3.1
          python -m pip check
      - name: Test and build connector
        run: |
          python -m pytest -q python/moneybee-connectors/tests
          python -m compileall -q python/moneybee-connectors/src python/moneybee-connectors/tests
          python -m pip wheel --no-deps --wheel-dir dist python/moneybee-connectors
      - name: Audit connector dependencies
        run: python -m pip_audit
      - name: Generate connector SBOM
        run: cyclonedx-py environment --output-format JSON --output-file dist/codestra-moneybee-connectors.sbom.cdx.json
      - name: Upload immutable connector evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: moneybee-python-connectors-${{ github.event.pull_request.head.sha || github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile
      - name: Reject production dependency vulnerabilities rated High or Critical
        run: pnpm security:audit
      - name: Validate canonical contracts semantically
        run: pnpm contracts:validate
      - name: Prove invalid contracts fail closed
        run: pnpm contracts:validate:negative
      - name: Build workspace
        run: pnpm build
      - name: Type-check workspace
        run: pnpm typecheck
      - name: Test workspace with coverage floor
        run: pnpm test:coverage
