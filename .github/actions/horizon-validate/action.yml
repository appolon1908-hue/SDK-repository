name: Horizon portfolio contract
description: Validate registered suites, root-shell inheritance, real authentication evidence, canonical domains, and token-only new colors.
inputs:
  manifest:
    description: Repository-relative Horizon suite manifest
    required: false
    default: horizon/suite.json
  base-ref:
    description: Pull-request base branch used to reject newly added raw colors
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Validate Horizon adoption
      shell: bash
      env:
        HORIZON_MANIFEST: ${{ inputs.manifest }}
        HORIZON_BASE_REF: ${{ inputs.base-ref }}
      run: |
        set -euo pipefail
        args=(--root "$GITHUB_WORKSPACE" --manifest "$HORIZON_MANIFEST")
        if [[ -n "$HORIZON_BASE_REF" ]]; then
          git -C "$GITHUB_WORKSPACE" fetch origin "$HORIZON_BASE_REF" --depth=1
          args+=(--base-ref "origin/$HORIZON_BASE_REF")
        fi
        node "$GITHUB_ACTION_PATH/validate.mjs" "${args[@]}"
